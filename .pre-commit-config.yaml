repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # nixfmt from the nixpkgs pinned in flake.lock, same version locally and in CI
      - id: nixfmt
        name: nixfmt
        entry: nix run --inputs-from . nixpkgs#nixfmt --
        language: system
        types: [nix]
      - id: statix
        name: statix
        entry: nix run --inputs-from . nixpkgs#statix -- check
        language: system
        types: [nix]
        # statix accepts only one target, so it lints the whole tree
        pass_filenames: false
      - id: deadnix
        name: deadnix
        entry: nix run --inputs-from . nixpkgs#deadnix -- --fail
        language: system
        types: [nix]
