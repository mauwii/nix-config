"$schema" = "https://starship.rs/config-schema.json"

# only values which differ from the defaults, see `starship print-config --default`

[aws]
symbol = "  "

[buf]
symbol = " "

[bun]
symbol = "🍞 "

[c]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
truncate_to_repo = false
read_only = " 󰌾"

[direnv]
symbol = "󱃬 "
detect_files = [".envrc", ".env"]
disabled = false

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "

[git_metrics]
disabled = false

[git_status]
format = '\[([$all_status$ahead_behind]($style))\] '
style = "white bold"
stashed = "[󱎝 ${count}](bright-black bold) "
ahead = "⇡${count} "
behind = "⇣${count} "
up_to_date = "[✓](green bold)"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "[!=${count}](red)"
deleted = "[✘${count}](red bold) "
modified = "[+${count}](bright-blue bold) "
staged = "[++${count}](bright-green bold) "
untracked = "[?${count}](yellow bold) "
typechanged = "[󰑤 ${count}](purple)"

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[package]
symbol = "󰏗 "

[python]
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shell]
bash_indicator = ""
zsh_indicator = "󱆃"
powershell_indicator = ""
disabled = false

[sudo]
style = "bold red"
disabled = false

[username]
style_user = "green"
show_always = true
