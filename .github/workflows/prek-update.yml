name: Update hooks

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      # skip releases younger than a week, in case one gets pulled or compromised
      - run: nix run --inputs-from . nixpkgs#prek -- update --cooldown-days 7
      - uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with GITHUB_TOKEN do not trigger CI; UPDATE_TOKEN (a PAT) does
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: prek-update
          title: "chore: update pre-commit hooks"
          commit-message: "chore: update pre-commit hooks"
          body: Updated hook versions from `prek update`.
          delete-branch: true
